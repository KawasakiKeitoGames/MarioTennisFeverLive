name: collect streams

# Vercel Hobby プランの Cron 制限を避けるため、定期取得は GitHub Actions で回す。
# デプロイ済みの /api/cron/collect を CRON_SECRET 付きで叩くだけ（外部APIの実行はVercel側）。
#
# 必要な GitHub Secrets（リポジトリ Settings > Secrets and variables > Actions）:
#   APP_URL      … 例 https://mtf-app.vercel.app （末尾スラッシュなし）
#   CRON_SECRET  … Vercel の環境変数と同じ値
#
# ⚠️ YouTube のクォータ(10,000/日)に注意。1回の取得で概ね200〜400ユニット消費するため、
#    下のスケジュールで足りない/多すぎる場合は cron 行を調整してください。
#    消費を半分にしたい場合は lib/youtube.ts の YT_QUERIES をキーワード1本に。

on:
  schedule:
    # 時刻はすべて UTC。日本のゴールデンタイム 20:00〜翌1:00 JST = 11:00〜16:00 UTC。
    - cron: "*/10 11-16 * * *"   # ゴールデンタイム相当を10分おき
    - cron: "0 0-10,17-23 * * *" # それ以外を毎時
  workflow_dispatch: {}          # 手動実行も可（動作確認用）

# 同時実行を防ぐ（前の取得が長引いても重複させない）
concurrency:
  group: collect-streams
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger collect endpoint
        run: |
          code=$(curl -sS -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/collect")
          echo "HTTP $code"
          cat /tmp/body
          echo
          if [ "$code" != "200" ]; then
            echo "::error::collect が HTTP $code を返しました"
            exit 1
          fi
