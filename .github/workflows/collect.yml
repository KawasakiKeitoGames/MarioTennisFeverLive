name: collect streams

# 定期取得は Supabase の pg_cron に移行済み（GitHub Actions の schedule は
# 高頻度だと遅延・間引きが起きて時刻が保証されないため）。
# このワークフローは手動実行（動作確認用）のみ残している。
#
# 必要な GitHub Secrets（手動実行に使用）:
#   APP_URL      … 例 https://mario-tennis-fever-live.vercel.app （末尾スラッシュなし）
#   CRON_SECRET  … Vercel の環境変数と同じ値

on:
  workflow_dispatch: {} # 手動実行のみ（定期取得は Supabase pg_cron 側）

# 同時実行を防ぐ（前の取得が長引いても重複させない）
concurrency:
  group: collect-streams
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger collect endpoint
        run: |
          code=$(curl -sS -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/collect")
          echo "HTTP $code"
          cat /tmp/body
          echo
          if [ "$code" != "200" ]; then
            echo "::error::collect が HTTP $code を返しました"
            exit 1
          fi
